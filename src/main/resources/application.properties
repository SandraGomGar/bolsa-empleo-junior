# Nombre de la aplicación
spring.application.name=bolsa-empleo-backend

# Configuración de MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/bolsa_empleo?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Desactivar configuración de seguridad por defecto
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update  
# ✅ Solo actualizar, no borrar
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.initialization-mode=always

# Cambia el puerto si el 8080 está ocupado
server.port=8081
